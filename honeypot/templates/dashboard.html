<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HoneyTrap — Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<style>
:root {
  --bg: #080c14;
  --surface: #0f1520;
  --surface2: #141d2b;
  --border: #1a2535;
  --border2: #243047;
  --accent: #f59e0b;
  --accent-dim: rgba(245,158,11,0.12);
  --red: #ef4444;
  --red-dim: rgba(239,68,68,0.12);
  --green: #10b981;
  --green-dim: rgba(16,185,129,0.12);
  --blue: #3b82f6;
  --blue-dim: rgba(59,130,246,0.12);
  --purple: #8b5cf6;
  --cyan: #06b6d4;
  --text: #e2e8f0;
  --muted: #4b6282;
  --muted2: #64748b;
  --mono: 'Courier New', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── TOP BAR ── */
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar-left { display: flex; align-items: center; gap: 16px; }
.logo { font-size: 1.1rem; font-weight: 700; color: var(--accent); letter-spacing: 0.12em; }
.logo span { color: var(--muted2); }
.pulse {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 6px var(--green);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.topbar-right { display: flex; align-items: center; gap: 20px; }
.clock { color: var(--muted2); font-size: 0.75rem; letter-spacing: 0.08em; }
.logout-btn {
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--muted2);
  padding: 5px 12px;
  font-family: var(--mono);
  font-size: 0.72rem;
  cursor: pointer;
  letter-spacing: 0.08em;
  transition: all 0.2s;
}
.logout-btn:hover { border-color: var(--red); color: var(--red); }

/* ── TAB NAV ── */
.tab-nav {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  padding: 0 20px;
  gap: 2px;
}
.tab-btn {
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--muted);
  padding: 10px 16px;
  font-family: var(--mono);
  font-size: 0.72rem;
  letter-spacing: 0.1em;
  cursor: pointer;
  transition: all 0.2s;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ── LAYOUT ── */
.main { display: flex; flex: 1; overflow: hidden; }
.tab-panel { display: none; flex: 1; overflow-y: auto; padding: 20px; }
.tab-panel.active { display: block; }

/* ── STAT CARDS ── */
.stat-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 20px; }
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 14px;
  position: relative;
  overflow: hidden;
}
.stat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
}
.stat-card.proto-ssh::before { background: var(--purple); }
.stat-card.proto-ftp::before { background: var(--cyan); }
.stat-card.proto-http::before { background: var(--blue); }
.stat-card.proto-telnet::before { background: var(--accent); }
.stat-card.proto-snmp::before { background: var(--green); }
.stat-card.proto-smb::before { background: var(--red); }

.stat-label { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.12em; margin-bottom: 6px; }
.stat-proto { font-size: 1.1rem; font-weight: 700; color: var(--text); }
.stat-count { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
.stat-sub { font-size: 0.65rem; color: var(--muted); margin-top: 2px; }
.stat-status { margin-top: 8px; display: flex; align-items: center; gap: 6px; }
.badge {
  font-size: 0.6rem;
  padding: 2px 7px;
  letter-spacing: 0.08em;
  font-weight: 700;
}
.badge.up { background: var(--green-dim); color: var(--green); border: 1px solid rgba(16,185,129,0.2); }
.badge.down { background: var(--red-dim); color: var(--red); border: 1px solid rgba(239,68,68,0.2); }
.port-label { font-size: 0.6rem; color: var(--muted); }

/* ── LIVE FEED ── */
.feed-grid { display: grid; grid-template-columns: 1fr 320px; gap: 16px; }
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
}
.panel-header {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.panel-title { font-size: 0.72rem; color: var(--muted2); letter-spacing: 0.1em; font-weight: 700; }
.panel-actions { display: flex; gap: 8px; }
.action-btn {
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--muted2);
  padding: 3px 10px;
  font-family: var(--mono);
  font-size: 0.65rem;
  cursor: pointer;
  letter-spacing: 0.06em;
  transition: all 0.2s;
}
.action-btn:hover { border-color: var(--accent); color: var(--accent); }
.action-btn.danger:hover { border-color: var(--red); color: var(--red); }

/* ── EVENT TABLE ── */
#event-table-container { height: 500px; overflow-y: auto; }
#event-table-container::-webkit-scrollbar { width: 4px; }
#event-table-container::-webkit-scrollbar-track { background: var(--bg); }
#event-table-container::-webkit-scrollbar-thumb { background: var(--border2); }
table { width: 100%; border-collapse: collapse; }
th {
  background: var(--surface2);
  color: var(--muted);
  font-size: 0.62rem;
  letter-spacing: 0.1em;
  padding: 8px 12px;
  text-align: left;
  position: sticky;
  top: 0;
}
td { padding: 7px 12px; border-bottom: 1px solid var(--border); font-size: 0.72rem; vertical-align: top; }
tr:hover td { background: rgba(255,255,255,0.02); }
tr.new-event { animation: flashIn 0.4s ease; }
@keyframes flashIn { from { background: rgba(245,158,11,0.08); } to { background: transparent; } }

.sev-INFO { color: var(--muted2); }
.sev-ALERT { color: var(--accent); font-weight: 700; }
.sev-CRITICAL { color: var(--red); font-weight: 700; }
.proto-tag {
  display: inline-block;
  padding: 1px 6px;
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.06em;
}
.proto-SSH { background: rgba(139,92,246,0.15); color: var(--purple); }
.proto-FTP { background: rgba(6,182,212,0.15); color: var(--cyan); }
.proto-HTTP { background: rgba(59,130,246,0.15); color: var(--blue); }
.proto-TELNET { background: rgba(245,158,11,0.15); color: var(--accent); }
.proto-SNMP { background: rgba(16,185,129,0.15); color: var(--green); }
.proto-SMB { background: rgba(239,68,68,0.15); color: var(--red); }

/* ── ALERT FEED ── */
.alert-list { height: 500px; overflow-y: auto; }
.alert-item {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  border-left: 3px solid transparent;
}
.alert-item.ALERT { border-left-color: var(--accent); background: rgba(245,158,11,0.03); }
.alert-item.CRITICAL { border-left-color: var(--red); background: rgba(239,68,68,0.03); }
.alert-time { font-size: 0.6rem; color: var(--muted); }
.alert-title { font-size: 0.75rem; color: var(--text); margin: 3px 0; }
.alert-detail { font-size: 0.65rem; color: var(--muted2); word-break: break-all; }

/* ── PROTOCOL CONTROL ── */
.proto-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.proto-card {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 20px;
}
.proto-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.proto-name { font-size: 1rem; font-weight: 700; letter-spacing: 0.1em; }
.toggle-btn {
  padding: 6px 16px;
  font-family: var(--mono);
  font-size: 0.72rem;
  font-weight: 700;
  cursor: pointer;
  border: none;
  letter-spacing: 0.06em;
  transition: all 0.2s;
}
.toggle-btn.start { background: var(--green-dim); color: var(--green); border: 1px solid rgba(16,185,129,0.3); }
.toggle-btn.start:hover { background: var(--green); color: #000; }
.toggle-btn.stop { background: var(--red-dim); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
.toggle-btn.stop:hover { background: var(--red); color: #fff; }

.field-group { margin-bottom: 12px; }
.field-label { font-size: 0.62rem; color: var(--muted); letter-spacing: 0.1em; margin-bottom: 5px; }
.field-input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 7px 10px;
  font-family: var(--mono);
  font-size: 0.8rem;
  outline: none;
}
.field-input:focus { border-color: var(--accent); }
select.field-input option { background: var(--surface); }

.save-btn {
  background: var(--accent-dim);
  border: 1px solid rgba(245,158,11,0.25);
  color: var(--accent);
  padding: 6px 14px;
  font-family: var(--mono);
  font-size: 0.7rem;
  cursor: pointer;
  letter-spacing: 0.06em;
  transition: all 0.2s;
}
.save-btn:hover { background: var(--accent); color: #000; }

/* ── LOGS ── */
.log-toolbar {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.log-select {
  background: var(--bg);
  border: 1px solid var(--border2);
  color: var(--text);
  padding: 5px 10px;
  font-family: var(--mono);
  font-size: 0.72rem;
  outline: none;
}
.log-select:focus { border-color: var(--accent); }
#log-output {
  height: 580px;
  overflow-y: auto;
  padding: 12px 16px;
  background: var(--bg);
  font-size: 0.7rem;
  line-height: 1.7;
  color: var(--muted2);
  white-space: pre-wrap;
  word-break: break-all;
}
#log-output .log-alert { color: var(--accent); }
#log-output .log-crit { color: var(--red); }
#log-output .log-info { color: var(--muted2); }

/* ── FILTER BAR ── */
.filter-bar {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.filter-select, .filter-input {
  background: var(--bg);
  border: 1px solid var(--border2);
  color: var(--text);
  padding: 5px 10px;
  font-family: var(--mono);
  font-size: 0.7rem;
  outline: none;
}
.filter-input { width: 200px; }
.filter-label { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.08em; }
.clear-btn {
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--muted2);
  padding: 5px 10px;
  font-family: var(--mono);
  font-size: 0.65rem;
  cursor: pointer;
}
.clear-btn:hover { color: var(--text); }

/* ── MISC ── */
.empty-state { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 0.8rem; }
.tag { display: inline-block; padding: 1px 6px; font-size: 0.6rem; border: 1px solid var(--border2); color: var(--muted2); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo">🍯 HONEY<span>TRAP</span></div>
    <div class="pulse"></div>
    <span style="font-size:0.65rem;color:var(--muted);letter-spacing:0.08em">LIVE MONITORING</span>
  </div>
  <div class="topbar-right">
    <div class="clock" id="clock">--:--:--</div>
    <a href="/logout"><button class="logout-btn">LOGOUT</button></a>
  </div>
</div>

<div class="tab-nav">
  <button class="tab-btn active" data-tab="overview">OVERVIEW</button>
  <button class="tab-btn" data-tab="live">LIVE FEED</button>
  <button class="tab-btn" data-tab="control">PROTOCOL CONTROL</button>
  <button class="tab-btn" data-tab="logs">LOG VIEWER</button>
</div>

<div class="main">

<!-- ── OVERVIEW ── -->
<div class="tab-panel active" id="tab-overview">
  <div class="stat-grid" id="stat-grid">
    <!-- injected by JS -->
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;">
    <!-- Recent Alerts -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">⚡ RECENT ALERTS</span>
        <button class="action-btn danger" onclick="clearAlerts()">CLEAR</button>
      </div>
      <div class="alert-list" id="alert-list-overview"></div>
    </div>
    <!-- Recent Events -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">📡 RECENT EVENTS</span>
      </div>
      <div style="height:380px;overflow-y:auto;">
        <table>
          <thead><tr><th>TIME</th><th>PROTO</th><th>SRC IP</th><th>EVENT</th></tr></thead>
          <tbody id="overview-events"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- ── LIVE FEED ── -->
<div class="tab-panel" id="tab-live">
  <div class="filter-bar">
    <span class="filter-label">FILTER:</span>
    <select class="filter-select" id="filter-proto">
      <option value="">ALL PROTOCOLS</option>
      <option>SSH</option><option>FTP</option><option>HTTP</option>
      <option>TELNET</option><option>SNMP</option><option>SMB</option>
    </select>
    <select class="filter-select" id="filter-sev">
      <option value="">ALL SEVERITY</option>
      <option>INFO</option><option>ALERT</option><option>CRITICAL</option>
    </select>
    <input class="filter-input" id="filter-text" placeholder="Search IP or details...">
    <button class="clear-btn" onclick="clearFilters()">CLEAR</button>
    <label style="display:flex;align-items:center;gap:6px;font-size:0.65rem;color:var(--muted);margin-left:auto;">
      <input type="checkbox" id="auto-scroll" checked> AUTO-SCROLL
    </label>
  </div>
  <div class="feed-grid">
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">📡 EVENT STREAM <span id="event-count" style="color:var(--accent)">[0]</span></span>
        <div class="panel-actions">
          <button class="action-btn" onclick="clearEvents()">CLEAR</button>
          <button class="action-btn" onclick="pauseFeed()" id="pause-btn">PAUSE</button>
        </div>
      </div>
      <div id="event-table-container">
        <table>
          <thead><tr>
            <th>TIMESTAMP</th><th>PROTO</th><th>SOURCE</th>
            <th>EVENT</th><th>SEV</th><th>DETAILS</th>
          </tr></thead>
          <tbody id="event-tbody"></tbody>
        </table>
      </div>
    </div>
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">⚡ ALERT FEED</span>
        <button class="action-btn danger" onclick="clearAlerts()">CLEAR</button>
      </div>
      <div class="alert-list" id="alert-list"></div>
    </div>
  </div>
</div>

<!-- ── PROTOCOL CONTROL ── -->
<div class="tab-panel" id="tab-control">
  <div class="proto-grid" id="proto-grid">
    <!-- injected by JS -->
  </div>
</div>

<!-- ── LOGS ── -->
<div class="tab-panel" id="tab-logs">
  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">📁 LOG VIEWER</span>
    </div>
    <div class="log-toolbar">
      <select class="log-select" id="log-proto">
        <option value="combined">COMBINED</option>
        <option value="ssh">SSH</option>
        <option value="ftp">FTP</option>
        <option value="http">HTTP</option>
        <option value="telnet">TELNET</option>
        <option value="snmp">SNMP</option>
        <option value="smb">SMB</option>
      </select>
      <input type="date" class="log-select" id="log-date">
      <button class="action-btn" onclick="loadLogs()">LOAD</button>
      <button class="action-btn" onclick="downloadLog()">⬇ DOWNLOAD</button>
      <button class="action-btn" onclick="loadLogs()" style="margin-left:auto">↻ REFRESH</button>
    </div>
    <div id="log-output"><span style="color:var(--muted)">Select a protocol and date, then click LOAD</span></div>
  </div>
</div>

</div><!-- /main -->

<script>
const socket = io();
let events = [];
let alerts = [];
let feedPaused = false;
let statusData = {};

// ── CLOCK ──
function updateClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US', {hour12: false});
}
setInterval(updateClock, 1000);
updateClock();

// ── TABS ──
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'overview') refreshStatus();
  });
});

// ── STATUS / OVERVIEW ──
async function refreshStatus() {
  const r = await fetch('/api/status');
  statusData = await r.json();
  renderStatGrid();
  renderProtoGrid();
}

function renderStatGrid() {
  const grid = document.getElementById('stat-grid');
  grid.innerHTML = Object.entries(statusData).map(([proto, s]) => `
    <div class="stat-card proto-${proto}">
      <div class="stat-label">PROTOCOL</div>
      <div class="stat-proto">${proto.toUpperCase()}</div>
      <div class="stat-count">${s.total}</div>
      <div class="stat-sub">${s.alerts} alerts · port ${s.port}</div>
      <div class="stat-status">
        <span class="badge ${s.running ? 'up' : 'down'}">${s.running ? '● LIVE' : '○ OFF'}</span>
        <span class="port-label">:${s.port}</span>
      </div>
    </div>
  `).join('');
}

// ── PROTO CONTROL ──
const PROTO_COLORS = {ssh:'var(--purple)',ftp:'var(--cyan)',http:'var(--blue)',telnet:'var(--accent)',snmp:'var(--green)',smb:'var(--red)'};
let bannerData = {};

async function loadBanners() {
  const r = await fetch('/api/banners');
  bannerData = await r.json();
}

function renderProtoGrid() {
  const grid = document.getElementById('proto-grid');
  if (!statusData || Object.keys(statusData).length === 0) return;
  grid.innerHTML = Object.entries(statusData).map(([proto, s]) => {
    const banners = bannerData[proto] || [];
    const bannerOpts = banners.map(b => `<option value="${b.value}" ${s.banner === b.value ? 'selected' : ''}>${b.name}</option>`).join('');
    const isRunning = s.running;
    return `
    <div class="proto-card" id="card-${proto}">
      <div class="proto-card-header">
        <div>
          <div class="proto-name" style="color:${PROTO_COLORS[proto] || 'var(--text)'}">${proto.toUpperCase()}</div>
          <div style="font-size:0.62rem;color:var(--muted);margin-top:3px">PORT ${s.port} · ${isRunning ? 'ACTIVE' : 'INACTIVE'}</div>
        </div>
        <button class="toggle-btn ${isRunning ? 'stop' : 'start'}" onclick="toggleProto('${proto}')">
          ${isRunning ? '■ STOP' : '▶ START'}
        </button>
      </div>
      <div class="field-group">
        <div class="field-label">PORT</div>
        <input class="field-input" id="${proto}-port" type="number" value="${s.port}">
      </div>
      <div class="field-group">
        <div class="field-label">BANNER / SERVER STRING</div>
        <select class="field-input" id="${proto}-banner-select" onchange="syncBanner('${proto}')">
          ${bannerOpts}
          <option value="__custom__">Custom…</option>
        </select>
        <input class="field-input" id="${proto}-banner" value="${s.banner}" style="margin-top:5px;font-size:0.72rem" placeholder="Custom banner string">
      </div>
      <div style="margin-top:6px;display:flex;gap:8px;align-items:center">
        <button class="save-btn" onclick="saveConfig('${proto}')">SAVE CONFIG</button>
        <span style="font-size:0.62rem;color:var(--muted)">Connections: ${s.total} · Alerts: ${s.alerts}</span>
      </div>
    </div>`;
  }).join('');
}

function syncBanner(proto) {
  const sel = document.getElementById(`${proto}-banner-select`);
  const inp = document.getElementById(`${proto}-banner`);
  if (sel.value !== '__custom__') inp.value = sel.value;
}

async function toggleProto(proto) {
  const s = statusData[proto];
  const action = s.running ? 'stop' : 'start';
  const r = await fetch('/api/toggle', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({protocol: proto, action})
  });
  const d = await r.json();
  if (d.success) {
    await refreshStatus();
  } else {
    alert('Error: ' + d.error);
  }
}

async function saveConfig(proto) {
  const port = document.getElementById(`${proto}-port`).value;
  const banner = document.getElementById(`${proto}-banner`).value;
  const r = await fetch('/api/update_config', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({protocol: proto, port, banner})
  });
  const d = await r.json();
  if (d.success) {
    await refreshStatus();
    showToast(`${proto.toUpperCase()} config saved`);
  }
}

// ── EVENTS ──
function makeRow(ev, cls='') {
  const ts = ev.timestamp ? ev.timestamp.replace('T',' ').split('.')[0] : '';
  const sevCls = `sev-${ev.severity || 'INFO'}`;
  const protoCls = `proto-${ev.protocol || ''}`;
  return `<tr class="${cls}">
    <td style="color:var(--muted);white-space:nowrap">${ts}</td>
    <td><span class="proto-tag ${protoCls}">${ev.protocol || ''}</span></td>
    <td style="color:var(--cyan)">${ev.src_ip || ''}:${ev.src_port || ''}</td>
    <td>${ev.event_type || ''}</td>
    <td class="${sevCls}">${ev.severity || ''}</td>
    <td style="color:var(--muted2);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${(ev.details||'').replace(/"/g,'&quot;')}">${ev.details || ''}</td>
  </tr>`;
}

function makeAlertItem(ev) {
  const ts = ev.timestamp ? ev.timestamp.replace('T',' ').split('.')[0] : '';
  return `<div class="alert-item ${ev.severity}">
    <div class="alert-time">${ts}</div>
    <div class="alert-title"><span class="proto-tag proto-${ev.protocol}">${ev.protocol}</span> ${ev.event_type}</div>
    <div class="alert-detail">${ev.src_ip}:${ev.src_port} — ${ev.details}</div>
  </div>`;
}

function applyFilters() {
  const proto = document.getElementById('filter-proto').value.toUpperCase();
  const sev   = document.getElementById('filter-sev').value.toUpperCase();
  const txt   = document.getElementById('filter-text').value.toLowerCase();
  return events.filter(ev =>
    (!proto || ev.protocol === proto) &&
    (!sev   || ev.severity === sev) &&
    (!txt   || (ev.src_ip||'').includes(txt) || (ev.details||'').toLowerCase().includes(txt))
  );
}

function renderEvents() {
  const filtered = applyFilters();
  const tbody = document.getElementById('event-tbody');
  tbody.innerHTML = filtered.map(ev => makeRow(ev)).join('');
  document.getElementById('event-count').textContent = `[${filtered.length}]`;

  // Overview table (last 30)
  const oTbody = document.getElementById('overview-events');
  oTbody.innerHTML = events.slice(0, 30).map(ev =>
    `<tr><td style="color:var(--muted);white-space:nowrap">${(ev.timestamp||'').split('T')[1]?.split('.')[0]||''}</td>
     <td><span class="proto-tag proto-${ev.protocol}">${ev.protocol}</span></td>
     <td style="color:var(--cyan)">${ev.src_ip}</td>
     <td style="color:var(--muted2)">${ev.event_type}</td></tr>`
  ).join('');
}

function renderAlerts() {
  const al = document.getElementById('alert-list');
  const al2 = document.getElementById('alert-list-overview');
  const html = alerts.map(makeAlertItem).join('') || '<div class="empty-state">No alerts yet</div>';
  if (al) al.innerHTML = html;
  if (al2) al2.innerHTML = html;
}

// ── SOCKET ──
socket.on('new_event', ev => {
  if (feedPaused) return;
  events.unshift(ev);
  if (events.length > 500) events.pop();
  renderEvents();
  if (document.getElementById('auto-scroll').checked) {
    const c = document.getElementById('event-table-container');
    if (c) c.scrollTop = 0;
  }
});

socket.on('new_alert', ev => {
  alerts.unshift(ev);
  if (alerts.length > 100) alerts.pop();
  renderAlerts();
  // Update stat counts
  if (statusData[ev.protocol?.toLowerCase()]) {
    statusData[ev.protocol.toLowerCase()].alerts++;
    renderStatGrid();
  }
});

// ── INITIAL LOAD ──
async function loadInitialEvents() {
  const r = await fetch('/api/events?limit=200');
  events = await r.json();
  const ar = await fetch('/api/events?limit=100&severity=ALERT');
  alerts = await ar.json();
  renderEvents();
  renderAlerts();
}

['filter-proto','filter-sev','filter-text'].forEach(id => {
  document.getElementById(id)?.addEventListener('input', renderEvents);
  document.getElementById(id)?.addEventListener('change', renderEvents);
});

function clearFilters() {
  document.getElementById('filter-proto').value = '';
  document.getElementById('filter-sev').value = '';
  document.getElementById('filter-text').value = '';
  renderEvents();
}

function clearEvents() {
  events = [];
  renderEvents();
}

function clearAlerts() {
  alerts = [];
  renderAlerts();
  fetch('/api/clear_alerts', {method:'POST'});
}

function pauseFeed() {
  feedPaused = !feedPaused;
  document.getElementById('pause-btn').textContent = feedPaused ? 'RESUME' : 'PAUSE';
}

// ── LOGS ──
document.getElementById('log-date').value = new Date().toISOString().split('T')[0];

async function loadLogs() {
  const proto = document.getElementById('log-proto').value;
  const date  = document.getElementById('log-date').value;
  const out = document.getElementById('log-output');
  out.innerHTML = '<span style="color:var(--muted)">Loading…</span>';
  const r = await fetch(`/api/logs?protocol=${proto}&date=${date}`);
  const d = await r.json();
  if (!d.lines || d.lines.length === 0) {
    out.innerHTML = `<span style="color:var(--muted)">No logs found for ${proto} on ${date}</span>`;
    return;
  }
  out.innerHTML = d.lines.map(line => {
    if (line.includes('[ALERT]') || line.includes('[CRITICAL]')) return `<span class="log-alert">${escHtml(line)}</span>`;
    if (line.includes('AUTH_ATTEMPT') || line.includes('SUSPICIOUS')) return `<span class="log-crit">${escHtml(line)}</span>`;
    return `<span class="log-info">${escHtml(line)}</span>`;
  }).join('');
  out.scrollTop = out.scrollHeight;
}

function downloadLog() {
  const proto = document.getElementById('log-proto').value;
  const date  = document.getElementById('log-date').value;
  window.open(`/api/download_log?protocol=${proto}&date=${date}`);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showToast(msg) {
  const t = document.createElement('div');
  t.style.cssText='position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--accent);color:var(--accent);padding:10px 18px;font-size:0.75rem;z-index:9999;letter-spacing:0.08em;';
  t.textContent = '✓ ' + msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// ── INIT ──
(async () => {
  await loadBanners();
  await refreshStatus();
  await loadInitialEvents();
  setInterval(refreshStatus, 10000);
})();
</script>
